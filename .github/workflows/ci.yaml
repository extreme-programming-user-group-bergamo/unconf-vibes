name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  ci:
    name: lint-test-build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.24"
          cache: true
          cache-dependency-path: go.sum

      - name: Download dependencies
        run: go mod download

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.4
          args: --timeout=5m ./...

      - name: Test
        run: go test ./... -v

      - name: Build
        run: make build
