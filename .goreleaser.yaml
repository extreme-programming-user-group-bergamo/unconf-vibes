version: 2

project_name: unconf

builds:
  - id: unconf
    main: ./cmd/unconf
    binary: unconf
    env:
      - CGO_ENABLED=0
    targets:
      - linux_amd64
      - darwin_amd64
      - darwin_arm64
      - windows_amd64

  - id: unconf-server
    main: ./cmd/server
    binary: unconf-server
    env:
      - CGO_ENABLED=1
    targets:
      - linux_amd64
      - darwin_amd64
      - darwin_arm64
      - windows_amd64

archives:
  - formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"

release: {}
